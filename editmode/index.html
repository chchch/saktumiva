              <summary>editions</summary>
              <ul id="edlist"></ul>
            </details>
            <details open>
              <summary>witnesses</summary>

            </details>
            <details>

        <article id="loader">
          <h1>SaktumIva</h1>

            <button id="startbutton">Select directory</button>

          <div class="dialog_buttons"><button id="modified_reload">Reload</button> <button id="modified_ignore">Ignore</button></div>
        </dialog>
    </div>
